name: cpp-core

on:
  push:
    branches: [ "master", "development", "Cpp" ]
    paths:
      - 'cpp/**'
      - '.github/workflows/cpp-core.yml'
  pull_request:
    branches: [ "master", "development" ]
    paths:
      - 'cpp/**'
      - '.github/workflows/cpp-core.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python (for pybind11 discovery)
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install pybind11
      run: python -m pip install pybind11
    - name: Configure
      run: >
        cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
        -DPYBIND11_DIR="$(python -c "import pybind11;print(pybind11.get_cmake_dir())")"
      shell: bash
    - name: Build core and tests
      run: cmake --build cpp/build --config Release --target unyts_tests
    - name: Run C++ tests
      run: ctest --test-dir cpp/build -C Release --output-on-failure
