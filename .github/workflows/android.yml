name: Android — Build & Package

on:
  push:
    branches: [Cpp, main]
    paths:
      - 'unyts_android/**'
      - 'cpp/**'
      - '.github/workflows/android.yml'
    tags: ['v*']          # version tags trigger the release build
  pull_request:
    branches: [main]
    paths:
      - 'unyts_android/**'
      - 'cpp/**'
  workflow_dispatch:          # Allow manual one-click builds from the GitHub UI

env:
  NDK_VERSION:   "26.3.11579264"
  CMAKE_VERSION: "3.22.1"
  JAVA_VERSION:  "17"

# Reusable step fragments via a shared setup job output isn't possible in plain
# YAML, so we repeat the three-step setup block in each job.
# Each job calls "Add SDK tools to PATH" before any sdkmanager call because
# $ANDROID_HOME/cmdline-tools/latest/bin is not on PATH by default on
# ubuntu-latest runners.
# gradle-wrapper.jar and gradle-wrapper.properties are committed, so no
# wrapper-generation step is needed.

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JVM unit tests (no device, fast)
  # ─────────────────────────────────────────────────────────────────────────────
  unit-test:
    name: JVM Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unyts_android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools"           >> "$GITHUB_PATH"

      - name: Accept SDK licences & install NDK + CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "ndk;${{ env.NDK_VERSION }}" \
            "cmake;${{ env.CMAKE_VERSION }}"

      - name: Run JVM unit tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: unyts_android/app/build/reports/tests/

  # ─────────────────────────────────────────────────────────────────────────────
  # Debug APK — installable on any Android phone once "Install unknown apps"
  # is enabled for the file manager / browser you use to open it.
  # ─────────────────────────────────────────────────────────────────────────────
  build-debug:
    name: Build Debug APK
    needs: unit-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unyts_android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools"           >> "$GITHUB_PATH"

      - name: Accept SDK licences & install NDK + CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "ndk;${{ env.NDK_VERSION }}" \
            "cmake;${{ env.CMAKE_VERSION }}"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: unyts-debug-apk
          path: unyts_android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Release APK — signed, suitable for direct distribution or Play Store.
  # Triggered only when a version tag is pushed:
  #   git tag v1.0.0 && git push origin v1.0.0
  #
  # Required GitHub repository secrets:
  #   KEYSTORE_BASE64   – base64-encoded .jks file
  #                       PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("release.jks")) | clip
  #   KEYSTORE_PASSWORD – keystore password
  #   KEY_ALIAS         – key alias (e.g. "unyts")
  #   KEY_PASSWORD      – key password
  # ─────────────────────────────────────────────────────────────────────────────
  build-release:
    name: Build Release APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unyts_android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools"           >> "$GITHUB_PATH"

      - name: Accept SDK licences & install NDK + CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "ndk;${{ env.NDK_VERSION }}" \
            "cmake;${{ env.CMAKE_VERSION }}"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE:     ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: unyts-release-apk
          path: unyts_android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: unyts_android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
