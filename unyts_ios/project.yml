# XcodeGen spec — generates unyts_ios.xcodeproj (not stored in git).
#   brew install xcodegen
#   cd unyts_ios && ./build.sh && xcodegen generate
name: unyts_ios
options:
  bundleIdPrefix: com.unyts
  deploymentTarget:
    iOS: "17.0"   # ContentUnavailableView (HistoryView) requires iOS 17
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CODE_SIGN_STYLE: Automatic
targets:
  unyts_ios:
    type: application
    platform: iOS
    sources:
      - path: unyts_ios
        excludes:
          - App/Info.plist
    dependencies:
      - framework: build/unyts.xcframework
        embed: false
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unyts.app
        INFOPLIST_FILE: unyts_ios/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: unyts_ios/Bridge/unyts_ios-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../cpp/include"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: "-lc++"
  UnytsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - UnytsTests
    dependencies:
      - target: unyts_ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unyts.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: unyts_ios/Bridge/unyts_ios-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/unyts_ios/Bridge $(SRCROOT)/../cpp/include"
  UnytsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UnytsUITests
    dependencies:
      - target: unyts_ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unyts.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  unyts_ios:
    build:
      targets:
        unyts_ios: all
    test:
      targets:
        - UnytsTests
  unyts_screenshots:
    build:
      targets:
        unyts_ios: all
    test:
      targets:
        - UnytsUITests
